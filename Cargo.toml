[package]
name = "sdo"
version = "0.1.0"
edition = "2021" # Rust editions define language features and idioms; "2021" is current standard, adding quality-of-life improvements, better module system, and more robust closure capture/inference than earlier editions.

[features]
default = []
testing = []
# Optional: Mahalanobis uniformity score and tests (off by default)
mahalanobis = []

[lib]
name = "sdo"
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = "0.8"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
pyo3 = { version = "0.21", features = ["auto-initialize", "extension-module"] }
numpy = "0.21"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# Profiling: release-Optimierungen mit Debuginfo für Flamegraphs
[profile.prof]
inherits = "release"
debug = true

# Benchmarks mit Debuginfo (für cargo flamegraph --bench)
[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "optimization_benchmarks"
harness = false

[[bench]]
name = "profiling_benchmarks"
harness = false
